{% if form.non_field_errors %}
    <div class="form-alert" role="alert">
        {% for error in form.non_field_errors %}{{ error }}{% endfor %}
    </div>
{% endif %}

<div class="form-grid">
    {% for field in form %}
        <div class="field {% if field.errors %}has-error{% endif %} {% if field.field.widget.input_type == 'textarea' %}field--full{% endif %} {% if field.field.widget.input_type == 'checkbox' %}field--checkbox{% endif %}">
            <label for="{{ field.id_for_label }}">
                {{ field.label }}
                {% if field.field.required %}<span class="required" aria-hidden="true">*</span>{% endif %}
            </label>
            {{ field }}
            {% if field.help_text %}<p class="helptext">{{ field.help_text }}</p>{% endif %}
            {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
        </div>
    {% endfor %}
</div>
